name: CI

# 提交门禁：后端全量测试 + 前端类型检查与单测 + 构建校验。
# 全部作业通过才允许合并；Go 集成测试依赖 PostgreSQL 服务容器。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tzl
          POSTGRES_PASSWORD: tzl_ci_password
          POSTGRES_DB: tzl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tzl -d tzl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: 格式检查
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请执行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi
      # -p 1：集成测试共用同一测试库（迁移 up/down 会重建表），必须按包串行执行
      - name: 全量测试
        working-directory: server
        env:
          TZL_TEST_DATABASE_URL: postgres://tzl:tzl_ci_password@localhost:5432/tzl_test?sslmode=disable
        run: go test -p 1 ./...
      # 接口层是全部对外行为的汇聚处，覆盖率掉下来意味着新增端点没有配套用例
      - name: 接口层覆盖率门禁
        env:
          TZL_TEST_DATABASE_URL: postgres://tzl:tzl_ci_password@localhost:5432/tzl_test?sslmode=disable
        run: bash scripts/coverage-gate.sh

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不写死版本：按 package.json 的 packageManager 字段安装对应 pnpm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm type-check
      - name: 单元测试
        run: pnpm -r test
      - name: 构建
        run: pnpm build

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 后端镜像
        run: docker build -t tokenzen/tzl:ci .
      - name: 前端镜像
        run: docker build -f Dockerfile.web -t tokenzen/web:ci .
