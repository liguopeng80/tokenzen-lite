# Token Zen Lite Nginx 配置（三个虚拟主机：portal / admin / api）
# SSL 证书路径按 acme.sh 实际部署位置调整。

# 上游后端
upstream tzl_backend {
    server 127.0.0.1:19030;
    keepalive 16;
}

# 前端页面的内容安全策略（portal / admin 共用）。
# connect-src 只放行 'self'：两个前端的数据全部经本站后端获取，不直连任何外部站点。
# style-src 需要 'unsafe-inline'——组件库运行时注入行内样式；script-src 不含 'unsafe-eval'。
map $host $tzl_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

# Portal（用户端）
server {
    listen 443 ssl;
    server_name example.com;
    ssl_certificate     /etc/nginx/ssl/example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $tzl_csp always;

    root /var/www/tokenzen/portal;
    index index.html;

    location /api/ {
        proxy_pass http://tzl_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Admin（管理端，来源 IP 白名单为部署强制项）
server {
    listen 443 ssl;
    server_name admin.example.com;
    ssl_certificate     /etc/nginx/ssl/example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    # 管理端来源 IP 白名单：allow 规则由独立文件提供，部署时必须先按
    # deploy/nginx-admin-allowlist.conf.example 创建该文件，否则 nginx -t
    # 直接失败——这是刻意设计，防止带着占位 IP 或无任何限制上线。
    # 确无固定来源 IP 时，在该文件中写 `allow all;` 显式放开，此时管理端登录
    # 仅剩应用层限流与账号锁定保护（见 docs/deployment.md 安全基线一节）。
    include /etc/nginx/tokenzen-admin-allowlist.conf;
    deny all;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $tzl_csp always;

    root /var/www/tokenzen/admin;
    index index.html;

    location /api/ {
        proxy_pass http://tzl_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API（仅 /v1 LLM API，供开发工具调用）
server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate     /etc/nginx/ssl/example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    location /v1/ {
        proxy_pass http://tzl_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;

        # SSE 关键配置：关缓冲、长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;

        # 图像 base64 请求体
        client_max_body_size 20m;
    }

    location / {
        return 404;
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name example.com admin.example.com api.example.com;
    return 301 https://$host$request_uri;
}
