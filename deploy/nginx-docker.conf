# 容器编排（docker compose）中 web 容器的 Nginx 配置。
# 与 deploy/nginx-tokenzen.conf 的差别：容器内不终结 TLS、不做来源 IP 白名单——
# 管理端端口由 compose 只绑定到宿主机回环地址，对外暴露须由外层反向代理负责。

upstream tzl_backend {
    server backend:19030;
    keepalive 16;
}

# 安全响应头（两个虚拟主机共用）
map $host $tzl_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

# Portal（用户端）：同时承载 /api 管理面与 /v1 中继
server {
    listen 8080;
    server_name _;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $tzl_csp always;

    root /usr/share/nginx/html/portal;
    index index.html;

    location /api/ {
        proxy_pass http://tzl_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        client_max_body_size 2m;
    }

    location /v1/ {
        proxy_pass http://tzl_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;

        # SSE 关键配置：关缓冲、长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;

        # 图像 base64 请求体
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Admin（管理端）：compose 默认只把该端口绑到宿主机回环地址
server {
    listen 8081;
    server_name _;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $tzl_csp always;

    root /usr/share/nginx/html/admin;
    index index.html;

    location /api/ {
        proxy_pass http://tzl_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
